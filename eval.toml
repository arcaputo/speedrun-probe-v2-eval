[eval]
type = "procs"                          # only provides procs: never a gate, never a score
evaluator = "deterministic"
entrypoint = "python probe.py"          # receives PROBE_KIND, PROBE_<PARAM> and HARNESS_PROBE=1

# probe.py reads this file for each proc's parameters (bounds, defaults) and max_wall_s, so they are stated once.

[eval.procs.loss-vs-parent]
class = "experiment"
description = "Train the parent and then the candidate for N steps each on one H100 (same machine, same seed, each on its own unmodified LR schedule): val loss every 100 steps on the full validation set, and ms/step. The 1-GPU numbers are a relative signal only, not the benchmark's"
# About 1250 s at 500 steps when the candidate reuses most of the parent's compiled graphs (README, Cost and time).
max_wall_s = 1500
needs_parent = true   # rebuilds the parent from changes.diff (git apply -R): Kupanga checks it reverses first
baseline = "in-job"   # measures the parent itself, on the same machine (Kupanga's cached parent, if any, is in $HARNESS_BASELINE_FILE; unused)
stages = ["downloading data", "rebuilding the parent", "compiling parent", "training parent",
          "compiling candidate", "training candidate"]
[eval.procs.loss-vs-parent.params]
steps = { type = "int", min = 100, max = 500, default = 300 }
[eval.procs.loss-vs-parent.outputs]
val_steps = { type = "list[float]", optional = true, description = "The steps the losses below were measured at: 100, 200, … up to the last multiple of 100 not past `steps`" }
parent_val_loss = { type = "list[float]", optional = true, noise = 0.0015, description = "Parent's val loss at val_steps (all 10.5M validation tokens, as the benchmark; one seed)" }
candidate_val_loss = { type = "list[float]", optional = true, noise = 0.0015, description = "Candidate's val loss at val_steps, same machine and seed" }
val_loss_delta = { type = "float", optional = true, noise = 0.0023, description = "Candidate − parent val loss at the last of val_steps (negative: the candidate is ahead). One seed: a few thousandths can be noise, and an early lead doesn't fix the final loss" }
ms_per_step = { type = "float", optional = true, description = "Candidate's train_time per step on one H100 (8-way gradient accumulation), the slope over steps 50 to `steps`, ms" }
parent_ms_per_step = { type = "float", optional = true, description = "Parent's train_time per step on the same H100, steps 50 to `steps`, ms" }
step_delta_pct = { type = "float", optional = true, description = "Candidate ms/step ÷ parent − 1, percent (one GPU: multi-GPU communication and optimizer sharding aren't measured)" }
caveats = { type = "string", optional = true, description = "What the numbers don't tell (single seed, early loss, one GPU)" }
critique = { type = "list[str]", optional = true, description = "Why there are no candidate numbers: the candidate's run crashed or didn't finish (with its first traceback), or the node has no parent" }
wall_s = { type = "float", optional = true, description = "Probe wall time, seconds" }

[eval.procs.full-run-1gpu]
class = "experiment"
description = "The candidate's whole training run on one H100 (8-way gradient accumulation, the same math as 8×H100), optionally with num_iterations overridden: final val loss, steps, 1-GPU train time. Validation runs only at the end"
# About 1900 s at num_iterations = 2600 (README, Cost and time).
max_wall_s = 2100
baseline = "parent"   # runs only the code it is given: Kupanga also runs it on the parent's code, once per node and params, and reports the delta
stages = ["downloading data", "compiling candidate", "training candidate", "validating candidate"]
[eval.procs.full-run-1gpu.params]
num_iterations = { type = "int", min = 1500, max = 2600, optional = true }   # override the step count without editing the code
[eval.procs.full-run-1gpu.outputs]
val_loss = { type = "float", optional = true, noise = 0.0015, description = "Val loss after the last step (all 10.5M validation tokens; one seed, so a few thousandths can be noise)" }
margin_to_target = { type = "float", optional = true, noise = 0.0015, description = "3.28 minus val_loss. The benchmark needs its 8 runs to average about 0.0016 under 3.28 (p < 0.01), 0.0021 to pass 80% of the time; one run's SD is 0.0015, worth about 25 steps, so use the speedrun-target gate (8 seeds) to choose a step count" }
steps = { type = "int", optional = true, description = "The run's planned total steps (num_iterations plus any extension the code adds)" }
num_iterations = { type = "int", optional = true, description = "num_iterations the run used: the parameter if given, else the code's own value" }
train_time_s = { type = "float", optional = true, description = "train_time of the final validation line on one H100, seconds: a relative signal only, about 8× the benchmark's" }
ms_per_step = { type = "float", optional = true, description = "train_time per step, the slope over steps 50 to the end, ms" }
reached_step = { type = "int", optional = true, description = "Last training step printed, when the run didn't finish" }
caveats = { type = "string", optional = true, description = "What the numbers don't tell (single seed, one GPU)" }
critique = { type = "list[str]", optional = true, description = "Why there is no final val loss: the run crashed or didn't finish in max_wall_s (with its first traceback)" }
wall_s = { type = "float", optional = true, description = "Probe wall time, seconds" }

# Time limits that follow the request (Kupanga holds, and the job is killed at, this many seconds), with margin:
# a candidate that runs out of time is charged, so these err long. loss-vs-parent: setup, two compiles and stops
# ~1000 s worst case, then ~0.48 s a step for each code plus a val pass every 100 steps (~1.2 s a step for both).
[eval.procs.loss-vs-parent.wall]
base_s = 1000
per = { steps = 1.2 }

# full-run-1gpu: setup and one compile ~650 s, then ~0.55 s a step with validation at the end. Without
# num_iterations (the code's own step count) it holds max_wall_s.
[eval.procs.full-run-1gpu.wall]
base_s = 650
per = { num_iterations = 0.55 }
